<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  body {
    background-color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
  }
  .card {
    background: #ffffff;
    border: 1.5px solid #0f172a;
    border-radius: 8px;
    padding: 20px;
    width: 920px;
  }
  .diagram-title {
    text-align: center;
    font-size: 14.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #0f172a;
    margin-bottom: 16px;
    border-bottom: 2px solid #0f172a;
    padding-bottom: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="diagram-title">System Architecture: 6-Level Closed-Loop SRE &amp; Agile DevOps Pipeline</div>

  <svg viewBox="0 0 880 770" width="100%" xmlns="http://www.w3.org/2000/svg">
    <!-- DEFINITIONS / ARROW MARKERS -->
    <defs>
      <marker id="m-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#1d4ed8"/></marker>
      <marker id="m-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#b91c1c"/></marker>
      <marker id="m-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#b45309"/></marker>
      <marker id="m-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#047857"/></marker>
      <marker id="m-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#4338ca"/></marker>
      <marker id="m-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 8 5 L 0 9 z" fill="#6d28d9"/></marker>
    </defs>

    <!-- ================= LEVEL 1 ================= -->
    <rect x="75" y="10" width="780" height="90" rx="6" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="75" y="10" width="780" height="24" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="26" font-size="11" font-weight="800" fill="#1e40af">LEVEL 1: CLIENT &amp; PRESENTATION LAYER</text>

    <rect x="255" y="42" width="420" height="48" rx="4" fill="#ffffff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="465" y="60" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Client Web Browser (Storefront UI)</text>
    <text x="465" y="76" font-size="9.5" fill="#475569" text-anchor="middle">Selects Delivery Address • Interacts with Flash Sale • Receives Stockout Notice</text>

    <!-- Arrow L1 -> L2 -->
    <path d="M 465 90 L 465 120" stroke="#1d4ed8" stroke-width="2" marker-end="url(#m-blue)"/>
    <rect x="470" y="96" width="165" height="18" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="552" y="109" font-size="8.5" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. POST /api/checkout</text>

    <!-- ================= LEVEL 2 ================= -->
    <rect x="75" y="125" width="780" height="95" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="75" y="125" width="780" height="24" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="141" font-size="11" font-weight="800" fill="#991b1b">LEVEL 2: COMPUTE &amp; APPLICATION MICROSERVICE LAYER (AWS LAMBDA)</text>

    <rect x="215" y="157" width="500" height="52" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
    <text x="465" y="175" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">Target Flask Application (watchdog-target-app)</text>
    <text x="465" y="191" font-size="9.5" fill="#475569" text-anchor="middle">Order Allocation Worker • ZeroDivisionError on 0-Stock Rush • Emits Structured Log</text>

    <!-- Arrow L2 -> L3 -->
    <path d="M 465 220 L 465 250" stroke="#b91c1c" stroke-width="2" marker-end="url(#m-red)"/>
    <rect x="470" y="226" width="180" height="18" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="560" y="239" font-size="8.5" font-weight="700" fill="#b91c1c" text-anchor="middle">2. Crash Log (HTTP 500)</text>

    <!-- ================= LEVEL 3 ================= -->
    <rect x="75" y="255" width="780" height="95" rx="6" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/>
    <rect x="75" y="255" width="780" height="24" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="90" y="271" font-size="11" font-weight="800" fill="#92400e">LEVEL 3: TELEMETRY &amp; REAL-TIME MONITORING LAYER (AMAZON CLOUDWATCH)</text>

    <rect x="215" y="287" width="500" height="52" rx="4" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="465" y="305" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">Amazon CloudWatch Log Group &amp; Subscription Filter</text>
    <text x="465" y="321" font-size="9.5" fill="#475569" text-anchor="middle">Filters Pattern [INCIDENT_DETECTED] • Dispatches Base64 Gzip Event to SRE Watchdog</text>

    <!-- Arrow L3 -> L4 -->
    <path d="M 345 350 L 345 380" stroke="#b45309" stroke-width="2" marker-end="url(#m-amber)"/>
    <rect x="350" y="356" width="170" height="18" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="435" y="369" font-size="8.5" font-weight="700" fill="#b45309" text-anchor="middle">3. Event Anomaly Trigger</text>

    <!-- ================= LEVEL 4 ================= -->
    <rect x="75" y="385" width="780" height="105" rx="6" fill="#f8fafc" stroke="#059669" stroke-width="1.5"/>
    <rect x="75" y="385" width="780" height="24" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="401" font-size="11" font-weight="800" fill="#065f46">LEVEL 4: AUTONOMOUS SRE TRIAGE &amp; CLOUD FORENSIC STORAGE LAYER</text>

    <!-- Watchdog Lambda -->
    <rect x="95" y="418" width="330" height="60" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="260" y="437" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">AWS Lambda Incident Watchdog</text>
    <text x="260" y="453" font-size="9.5" fill="#475569" text-anchor="middle">Decodes Log • Extracts Traceback • Assigns INC-ID</text>
    <text x="260" y="468" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">Formats Standard Agile User Story</text>

    <!-- Arrow L4 Watchdog -> S3 -->
    <path d="M 425 448 L 485 448" stroke="#047857" stroke-width="2" marker-end="url(#m-green)"/>
    <text x="455" y="440" font-size="8" font-weight="700" fill="#047857" text-anchor="middle">4a. PutObject</text>

    <!-- S3 Bucket -->
    <rect x="490" y="418" width="345" height="60" rx="4" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
    <text x="662" y="437" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Amazon S3 Forensic Vault</text>
    <text x="662" y="453" font-size="9.5" fill="#475569" text-anchor="middle">Bucket: devops-incident-watchdog-logs</text>
    <text x="662" y="468" font-size="9" font-weight="600" fill="#059669" text-anchor="middle">Tamper-Proof Audit JSON Archive</text>

    <!-- Arrow L4 -> L5 -->
    <path d="M 260 490 L 260 520 L 375 520" stroke="#047857" stroke-width="2" marker-end="url(#m-green)"/>
    <rect x="265" y="506" width="180" height="18" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="355" y="519" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">4b. POST /issues (Agile Story)</text>

    <!-- ================= LEVEL 5 ================= -->
    <rect x="75" y="525" width="780" height="95" rx="6" fill="#f8fafc" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="75" y="525" width="780" height="24" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="90" y="541" font-size="11" font-weight="800" fill="#3730a3">LEVEL 5: AGILE BACKLOG &amp; SPRINT MANAGEMENT LAYER (GITHUB ISSUES)</text>

    <rect x="215" y="557" width="500" height="52" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="465" y="575" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">GitHub Issues Sprint Backlog Board</text>
    <text x="465" y="591" font-size="9.5" fill="#475569" text-anchor="middle">Auto-Generated Bug User Story #1 • Labels: [bug, sprint-backlog] • Acceptance Criteria Checklist</text>

    <!-- Arrow L5 -> L6 -->
    <path d="M 465 620 L 465 650" stroke="#4338ca" stroke-width="2" marker-end="url(#m-indigo)"/>
    <rect x="470" y="626" width="230" height="18" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="585" y="639" font-size="8.5" font-weight="700" fill="#4338ca" text-anchor="middle">5. git commit -m "Fixes #1" &amp; git push</text>

    <!-- ================= LEVEL 6 ================= -->
    <rect x="75" y="655" width="780" height="95" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="75" y="655" width="780" height="24" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="90" y="671" font-size="11" font-weight="800" fill="#5b21b6">LEVEL 6: CONTINUOUS INTEGRATION &amp; CLOSED-LOOP DELIVERY (CI/CD) LAYER</text>

    <rect x="215" y="687" width="500" height="52" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="465" y="705" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">GitHub Actions CI/CD Pipeline Automation Engine</text>
    <text x="465" y="721" font-size="9.5" fill="#475569" text-anchor="middle">Automated Pytest Regression (9 Tests) • Zero-Downtime AWS Deploy • Auto-Closes Issue #1</text>

    <!-- FEEDBACK LOOP LINE: L6 -> L2 -->
    <path d="M 215 713 L 30 713 L 30 173 L 210 173" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5,4" fill="none" marker-end="url(#m-purple)"/>
    <rect x="36" y="380" width="18" height="200" fill="#ffffff" stroke="#cbd5e1" rx="3"/>
    <text x="45" y="480" font-size="8" font-weight="800" fill="#7c3aed" transform="rotate(-90 45 480)" text-anchor="middle">6. CLOSED-LOOP CONTINUOUS DELIVERY (PATCH DEPLOYED)</text>
  </svg>
</div>

</body>
</html>
